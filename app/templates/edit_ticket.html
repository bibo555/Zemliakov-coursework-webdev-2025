{% extends "base.html" %}

{% block title %}Редактировать билет — FreeFly{% endblock %}

{% block content %}
<div class="admin-container">
    <h1>Редактировать билет</h1>
    
    <form method="POST" action="{{ url_for('admin.edit_ticket', ticket_id=ticket.id) }}">
        <div class="form-group">
            <label for="airline">Авиакомпания</label>
            <input type="text" id="airline" name="airline" value="{{ ticket.airline.name }}" required>
        </div>
        
        <div class="form-group">
            <label for="origin">Откуда</label>
            <input type="text" id="origin" name="origin" value="{{ ticket.origin.code }} ({{ ticket.origin.city }})" required>
        </div>
        
        <div class="form-group">
            <label for="destination">Куда</label>
            <input type="text" id="destination" name="destination" value="{{ ticket.destination.code }} ({{ ticket.destination.city }})" required>
        </div>
        
        <div class="form-row">
            <div class="form-group">
                <label for="departure_time">Время вылета</label>
                <input type="time" id="departure_time" name="departure_time" value="{{ ticket.departure_time.strftime('%H:%M') }}" required>
            </div>
            
            <div class="form-group">
                <label for="arrival_time">Время прилета</label>
                <input type="time" id="arrival_time" name="arrival_time" value="{{ ticket.arrival_time.strftime('%H:%M') }}" required>
            </div>
        </div>
        
        <div class="form-group">
            <label for="duration">Длительность</label>
            <input type="text" id="duration" name="duration" value="{{ ticket.duration // 60 }}ч {{ ticket.duration % 60 }}м" required>
        </div>
        
        <div class="form-row">
            <div class="form-group">
                <label for="price">Цена (руб)</label>
                <input type="number" id="price" name="price" value="{{ ticket.price }}" required>
            </div>
            
            <div class="form-group">
                <label for="departure_date">Дата вылета</label>
                <input type="date" id="departure_date" name="departure_date" value="{{ ticket.departure_date.strftime('%Y-%m-%d') }}" required>
            </div>
        </div>
        
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Сохранить</button>
            <a href="{{ url_for('admin.admin_tickets') }}" class="btn btn-secondary">Отмена</a>
        </div>
    </form>
</div>
{% endblock %}
